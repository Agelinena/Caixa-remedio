// Substitui o android/app/build.gradle gerado pelo "flutter create" (Flutter 3.27).
// Assinatura: lê android/key.properties, que o GitHub Actions cria a partir dos secrets.
// Sem key.properties o APK sai assinado com a chave de debug (só para testes).
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keyProps = new Properties()
def keyFile = rootProject.file("key.properties")
if (keyFile.exists()) {
    keyFile.withInputStream { keyProps.load(it) }
}

android {
    namespace = "br.caixaremedios.caixa_remedios"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "br.caixaremedios.caixa_remedios"
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile = rootProject.file(keyProps["storeFile"])
                storePassword = keyProps["storePassword"]
                keyAlias = keyProps["keyAlias"]
                keyPassword = keyProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keyFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
