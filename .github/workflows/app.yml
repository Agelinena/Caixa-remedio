# Gera o APK do app. Baixe em Actions > (execução) > Artifacts,
# ou na página Releases quando a tag começar com "app-v" (ex.: app-v0.1.0).
#
# Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   arquivo .p12 em base64
#   ANDROID_KEYSTORE_PASSWORD senha do arquivo (igual à da chave)
#   ANDROID_KEY_ALIAS         apelido da chave
# Sem esses secrets o APK sai com a chave de debug (instala, mas não atualiza
# por cima de um APK assinado com a chave certa).
name: App Android

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
    tags: ["app-v*"]
  pull_request:
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Gerar a pasta android
        run: |
          flutter create --platforms=android --org br.caixaremedios --project-name caixa_remedios .
          rm -f test/widget_test.dart
          cp -r android_extra/. android/
          # Versões novas do Gradle/AGP/Kotlin (os plugins atuais pedem)
          sed -i -E 's/(id "com.android.application" version )"[^"]+"/\1"8.7.3"/' android/settings.gradle
          sed -i -E 's/(id "org.jetbrains.kotlin.android" version )"[^"]+"/\1"2.1.0"/' android/settings.gradle
          sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep -E 'com.android.application|kotlin.android' android/settings.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::warning::Sem secrets de assinatura: APK com chave de debug"; exit 0; fi
          echo "$KS_B64" | base64 -d > android/app/upload.p12
          {
            echo "storeFile=app/upload.p12"
            echo "storePassword=$KS_PASS"
            echo "keyPassword=$KS_PASS"
            echo "keyAlias=$KS_ALIAS"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Compilar o APK
        run: |
          VERSAO=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          flutter build apk --release --build-number=${{ github.run_number }} --build-name="$VERSAO"
          cp build/app/outputs/flutter-apk/app-release.apk "build/caixa-remedios-$VERSAO-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: caixa-remedios-apk
          path: app/build/caixa-remedios-*.apk

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/caixa-remedios-*.apk
