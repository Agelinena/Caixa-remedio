# Compila o firmware do ESP32. O .bin fica em Actions > (execução) > Artifacts,
# e na página Releases quando a tag começar com "fw-v" (ex.: fw-v0.1.0).
name: Firmware ESP32

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
    tags: ["fw-v*"]
  pull_request:
    paths: ["firmware/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware
      - name: Juntar arquivos
        run: |
          mkdir -p saida
          B=firmware/.pio/build/esp32dev
          cp $B/firmware.bin saida/caixa-firmware.bin
          cp $B/bootloader.bin $B/partitions.bin saida/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin saida/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: caixa-firmware
          path: saida/
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/fw-v')
        uses: softprops/action-gh-release@v2
        with:
          files: saida/*
