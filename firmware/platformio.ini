; Caixa de remedios inteligente - firmware do ESP32 (PlatformIO)
; O codigo fica em CaixaRemedios/ (abre direto no Arduino IDE).
; Compilar:  pio run -d firmware
; Gravar:    pio run -d firmware -t upload
; Serial:    pio device monitor -d firmware

[platformio]
src_dir = CaixaRemedios

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_deps =
    adafruit/RTClib@^2.1.4
    bblanchon/ArduinoJson@^7.2.0
